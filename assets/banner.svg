  </text>

  <rect x="540" y="150" width="120" height="3" rx="2" fill="url(#accent)"/>

  <text x="600" y="188" text-anchor="middle"
        fill="#CBD5E1" font-family="Arial,sans-serif"
        font-size="21">
    VLSI · Wireless Communication · Quantum Systems
  </text>

  <text x="600" y="218" text-anchor="middle"
        fill="#94A3B8" font-family="Arial,sans-serif"
        font-size="17">
    Artificial Intelligence · Signal Processing · Scientific Computing
  </text>

  <rect x="0" y="274" width="1200" height="6" rx="3" fill="url(#accent)"/>
</svg>
