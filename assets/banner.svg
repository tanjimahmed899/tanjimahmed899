<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070D19"/>
      <stop offset="55%" stop-color="#0D192D"/>
      <stop offset="100%" stop-color="#102C40"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3FC" stroke-width="0.5" opacity=".10"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#grid)"/>

  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity=".30">
    <path d="M0 60H130L175 105H240"/>
    <path d="M0 210H100L150 160H220"/>
    <path d="M960 60H1040L1100 120H1200"/>
    <path d="M960 220H1040L1090 170H1200"/>
    <circle cx="240" cy="105" r="5"/>
    <circle cx="220" cy="160" r="5"/>
    <circle cx="960" cy="60" r="5"/>
    <circle cx="960" cy="220" r="5"/>
  </g>

  <text x="600" y="55" text-anchor="middle"
        fill="#7DD3FC" font-family="Arial,sans-serif"
        font-size="13" letter-spacing="5">
    ENGINEERING • RESEARCH • INNOVATION
  </text>

  <text x="600" y="126" text-anchor="middle"
        fill="#F1F5F9" font-family="Arial,sans-serif"
        font-size="58" font-weight="700" letter-spacing="3">
